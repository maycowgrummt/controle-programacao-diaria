<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem conexão | Controle de Programação Diária</title>
    <link rel="icon" type="image/png" href="img/icone-192.png">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            display: grid; place-items: center; padding: 16px; color: #111827;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(100deg, #004f86 0%, #0072bc 55%, #1b95d6 100%);
        }
        .caixa {
            width: 100%; max-width: 380px; background: #fff; border-radius: 20px; padding: 32px 24px;
            text-align: center; box-shadow: 0 20px 40px rgba(16, 24, 40, .25);
        }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 20px; margin: 16px 0 6px; }
        p { color: #4b5563; margin: 0 0 20px; line-height: 1.5; }
        button {
            font: inherit; font-weight: 700; color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer;
            background: linear-gradient(180deg, #1b95d6, #0072bc);
        }
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(100deg, #04213a 0%, #073659 55%, #0b4d7c 100%); }
            .caixa { background: #141a21; color: #eef2f6; }
            p { color: #b4bfcb; }
        }
    </style>
</head>
<body>
    <div class="caixa">
        <img src="img/icone-192.png" alt="">
        <h1>Sem conexão com a internet</h1>
        <p>O Controle de Programação Diária precisa de internet para funcionar. Assim que a conexão voltar, a página abre sozinha.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
